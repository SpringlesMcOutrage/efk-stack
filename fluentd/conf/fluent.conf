# Приймаємо логи від Docker logging driver (fluentd)
<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# Парсимо JSON-логи з поля log
<filter bank.**>
  @type parser
  key_name log
  reserve_data true
  remove_key_name_field true
  <parse>
    @type json
  </parse>
</filter>

# Відправляємо в Elasticsearch
<match bank.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix bank-logs
  logstash_dateformat %Y.%m.%d
  include_tag_key true
  tag_key @log_name
  flush_interval 5s
  <buffer>
    flush_interval 5s
    retry_max_times 5
  </buffer>
</match>
